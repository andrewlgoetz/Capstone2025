## FoodBank Inventory System — Render Blueprint
##
## Deploy steps for a new food bank:
##   1. Fork this repo on GitHub
##   2. Go to render.com → New → Blueprint → connect your fork
##   3. Render provisions the database, backend, and frontend automatically
##   4. After deploy: set CORS_ORIGINS and VITE_API_BASE_URL (see notes below)
##   5. Open the backend Shell tab → run: python setup.py
##
## URL wiring (two values to set manually after first deploy):
##   - In the foodbank-backend service: set CORS_ORIGINS to your frontend URL
##     e.g. https://foodbank-frontend.onrender.com
##   - In the foodbank-frontend service: set VITE_API_BASE_URL to your backend URL
##     e.g. https://foodbank-backend.onrender.com
##   Then trigger a manual redeploy of the frontend so Vite picks up the new URL.
##
## Mobile (future): add the backend URL to CORS_ORIGINS when ready.

databases:
  - name: foodbank-db
    databaseName: foodbank
    user: foodbankuser
    plan: free

services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: foodbank-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodbank-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: CORS_ORIGINS
        sync: false                # Set this to your frontend URL after first deploy
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend (React/Vite static site) ────────────────────────────────────
  - type: web
    name: foodbank-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache            # ensures users always get the latest build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html   # required for React Router client-side routing
    envVars:
      - key: VITE_API_BASE_URL
        sync: false                # Set this to your backend URL, then redeploy frontend
